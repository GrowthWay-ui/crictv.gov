<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B11">
<meta name="monetag" content="4bd202a3bb2f9f28e12e2fc17e6e1c10">
<title>CRICTV07</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fd:'Cinzel',serif;
  --sky:#00D2FF; --sky2:#38BDF8; --org:#FF6B00; --org2:#FB923C; --grn:#00E676; --grn2:#10B981;
  --bg:#080B11; --card:#121824; --text:#EAF2FF; --muted:#8A97AD;
  --glass:rgba(18,24,36,.62); --line:rgba(56,189,248,.28);
  --shadow:0 22px 38px -12px rgba(0,0,0,.75), 0 6px 0 -2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
  --glow:0 0 18px rgba(0,210,255,.35);
  --bgimg:radial-gradient(60% 40% at 15% 0%,rgba(0,210,255,.16),transparent 70%),radial-gradient(50% 35% at 100% 20%,rgba(255,107,0,.12),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(0,230,118,.08),transparent 70%);
}
[data-theme="light"]{
  --bg:#F0F4F8; --card:#FFFFFF; --text:#0F172A; --muted:#64748B;
  --glass:rgba(255,255,255,.72); --line:rgba(14,165,233,.3);
  --shadow:0 18px 30px -14px rgba(30,64,110,.28), 0 4px 0 -1px #dde5ee, inset 0 1px 0 #fff;
  --glow:0 0 14px rgba(0,210,255,.25);
  --bgimg:radial-gradient(60% 40% at 15% 0%,rgba(56,189,248,.25),transparent 70%),radial-gradient(50% 35% at 100% 20%,rgba(251,146,60,.2),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(16,185,129,.12),transparent 70%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;color:var(--text);overflow-x:hidden;transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;perspective:1200px}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:40px;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s;transform-origin:center;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
#home{transform:none}
#links{transform:translateX(105%) rotateY(-18deg);opacity:0;pointer-events:none}
.app.in-links #home{transform:translateX(-30%) rotateY(14deg) scale(.92);opacity:0;pointer-events:none}
.app.in-links #links{transform:none;opacity:1;pointer-events:auto}

/* 3D tilt */
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;transform-style:preserve-3d;will-change:transform}
.tilt.release{transition:transform .5s cubic-bezier(.2,.8,.2,1)}

/* Header */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:var(--glass);border-bottom:1px solid var(--line);box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}
.brand{font-family:var(--fd);font-weight:900;font-size:21px;letter-spacing:1.2px;background:linear-gradient(100deg,var(--sky) 10%,#fff 45%,var(--org) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(0,210,255,.4));white-space:nowrap}
[data-theme="light"] .brand{background:linear-gradient(100deg,#0284c7 10%,#38BDF8 45%,var(--org) 90%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 rgba(255,255,255,.9)) drop-shadow(0 4px 6px rgba(0,100,160,.25))}
.icons{display:flex;gap:7px}
.ib{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--card) 70%,#000 12%));border:1px solid var(--line);box-shadow:0 6px 10px -3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .15s,box-shadow .15s}
.ib:active{transform:translateY(2px) scale(.94);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ib svg{width:18px;height:18px;stroke:var(--sky2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.fav.on svg{fill:var(--org2);stroke:var(--org2)}
.ib.spin svg{animation:spin360 .8s ease}
@keyframes spin360{to{transform:rotate(360deg)}}
.searchbar{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s,padding .3s;padding:0 14px}
.searchbar.open{max-height:70px;opacity:1;padding:10px 14px 0}
.searchbar input{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:500 15px 'Outfit';outline:none;box-shadow:inset 0 3px 8px rgba(0,0,0,.25),var(--glow)}

.i3 svg{filter:drop-shadow(0 4px 3px rgba(0,0,0,.45)) drop-shadow(0 0 6px rgba(0,210,255,.25))}
.inl{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin-left:4px}
.inl svg{width:100%;height:100%}
.brandwrap{display:flex;align-items:center;gap:8px;perspective:300px;min-width:0}
.tvlogo{width:44px;height:40px;flex:0 0 auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(0,210,255,.5));animation:tvt 5s ease-in-out infinite}
@keyframes tvt{0%,100%{transform:rotateY(-18deg) rotateX(6deg)}50%{transform:rotateY(18deg) rotateX(-4deg)}}
.reg{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin:0 2px}
.reg svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.cat .av svg{width:32px;height:32px}

/* Categories */
.cats{display:flex;gap:16px;overflow-x:auto;padding:18px 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;width:64px}
.cat .ring{position:relative;width:62px;height:62px;border-radius:50%;padding:3px;background:var(--line);box-shadow:var(--shadow)}
.cat .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--sky),var(--org),var(--sky));opacity:0;animation:spin360 3s linear infinite}
.cat.on .ring::before{opacity:1}
.cat .av{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--card) 80%,#fff 20%),var(--card) 70%);box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),inset 0 3px 6px rgba(255,255,255,.12)}
.cat span{font:700 11.5px 'Plus Jakarta Sans';color:var(--muted);white-space:nowrap}
.cat.on span{color:var(--sky2)}

/* Tabs */
.tabs{display:flex;gap:8px;padding:12px 14px 6px}
.tab{flex:1;padding:11px 4px;border-radius:999px;font:800 11.5px 'Plus Jakarta Sans';letter-spacing:.3px;color:var(--muted);background:var(--card);border:1px solid var(--line);box-shadow:0 6px 0 -2px rgba(0,0,0,.35),var(--shadow);transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab.on{color:var(--text);transform:translateY(-3px) scale(1.04);border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,var(--org),var(--sky)) border-box;box-shadow:0 0 18px rgba(255,107,0,.35),0 0 18px rgba(0,210,255,.3),0 10px 14px -6px rgba(0,0,0,.6)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.45}}

/* Notice */
.notice{margin:12px 14px 4px;width:calc(100% - 28px);display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.notice .mega{width:30px;height:30px;flex:0 0 auto;animation:wob 2.6s infinite}.notice .mega svg{width:100%;height:100%}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}92%{transform:rotate(10deg)}}
.notice b{flex:1;font:600 13.5px 'Outfit'}
.notice .ar{color:var(--org2);font-weight:800;font-size:18px}

/* Cards */
.list{display:flex;flex-direction:column;gap:20px;padding:16px 14px 20px}
.card{position:relative;border-radius:var(--rad,24px);overflow:hidden;min-height:190px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.02);cursor:pointer;isolation:isolate}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,var(--sky),transparent 40%,var(--org));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7;pointer-events:none}
.art{position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,hsl(var(--h1) 80% 30%),hsl(var(--h2) 70% 10%) 70%)}
.art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px)}
.art .big{position:absolute;top:34%;left:0;right:0;text-align:center;font:900 30px var(--fd);letter-spacing:2px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 22px rgba(0,210,255,.6);transform:translateZ(40px)}
.art .big small{display:block;font:700 12px 'Plus Jakarta Sans';letter-spacing:1.5px;color:var(--org2);margin-top:6px;text-shadow:none}
.art .shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.85))}
.card .badge{position:absolute;top:14px;left:14px}
.pill-live{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font:800 11.5px 'Plus Jakarta Sans';color:#04140b;background:linear-gradient(180deg,#5dffb0,var(--grn));box-shadow:0 4px 0 #00a152,0 0 18px rgba(0,230,118,.6);animation:glowG 1.6s infinite}
.pill-live i{width:8px;height:8px;border-radius:50%;background:#04140b;animation:pulse 1.2s infinite}
@keyframes glowG{50%{box-shadow:0 4px 0 #00a152,0 0 30px rgba(0,230,118,.95)}}
.pill-up,.pill-fin{display:inline-block;padding:6px 12px;border-radius:999px;font:800 11.5px 'Plus Jakarta Sans';color:#fff;background:rgba(0,210,255,.25);border:1px solid var(--sky);backdrop-filter:blur(8px)}
.pill-fin{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}
.card .foot{position:absolute;left:16px;right:14px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;transform:translateZ(30px)}
.foot h3{font:900 19px var(--fd);color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.7);line-height:1.15}
.foot p{font:500 12.5px 'Outfit';color:#c6d6ee;margin-top:3px}
.watch{flex:0 0 auto;padding:11px 18px;border-radius:14px;font:800 13px 'Plus Jakarta Sans';letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,var(--org2),var(--org));box-shadow:0 5px 0 #b34700,0 10px 20px rgba(255,107,0,.5),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s,box-shadow .12s}
.watch:active{transform:translateY(4px);box-shadow:0 1px 0 #b34700,0 4px 8px rgba(255,107,0,.4)}
.brandtag{position:absolute;top:14px;right:14px;font:800 11px 'Plus Jakarta Sans';letter-spacing:1px;padding:6px 10px;border-radius:10px;color:var(--sky);background:rgba(0,0,0,.45);border:1px solid var(--sky);box-shadow:var(--glow)}
.card.score{min-height:230px;color:#fff}
.card.score .art{background:linear-gradient(105deg,#0b7a3e 0%,#10B981 42%,#c2410c 58%,#9f1239 100%)}
.card.score .art::before{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.18),transparent 55%)}
.card.score .ttl{position:absolute;top:16px;left:0;right:0;text-align:center;font:900 13.5px var(--fd);letter-spacing:1.2px;text-shadow:0 2px 6px rgba(0,0,0,.6);padding:0 70px 0 14px}
.card.score .mid{position:absolute;left:0;right:0;top:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;transform:translateZ(40px)}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;font:800 10.5px 'Plus Jakarta Sans';letter-spacing:.6px}
.logo3d{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:900 17px var(--fd);background:radial-gradient(circle at 30% 25%,#fff,#cfe9ff 35%,#4b86b8 100%);color:#0b2a44;box-shadow:0 14px 16px -4px rgba(0,0,0,.6),inset 0 -6px 10px rgba(0,0,0,.25);animation:float 3.2s ease-in-out infinite}
.team:last-child .logo3d{background:radial-gradient(circle at 30% 25%,#fff,#ffd6d6 35%,#a52a3a 100%);color:#4a0d17;animation-delay:-1.6s}
@keyframes float{50%{transform:translateY(-6px)}}
.scorebox{text-align:center;padding:0 8px}
.scorebox .sc{font:900 40px 'Outfit';text-shadow:0 5px 0 rgba(0,0,0,.35),0 0 24px rgba(255,255,255,.4)}
.scorebox .ov{font:700 12.5px 'Outfit';color:#FFD166;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.card.score .inn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateZ(30px);padding:6px 14px;border-radius:999px;font:800 11px 'Plus Jakarta Sans';background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(8px);white-space:nowrap}
.card.score .watch{position:absolute;right:14px;bottom:10px;padding:8px 12px;font-size:11px}
.card.score .badge{z-index:2}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-weight:500}

/* Links screen */
.lbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:var(--glass);border-bottom:1px solid var(--line)}
.lbar .tt{flex:1}
.lbar h2{font:900 19px var(--fd);letter-spacing:.5px}
.lbar small{font:600 12px 'Outfit';color:var(--sky2)}
.hero{position:relative;margin:16px 14px 0;border-radius:var(--rad,22px);overflow:hidden;min-height:150px;border:1px solid var(--line);box-shadow:var(--shadow);isolation:isolate}
.hero .art .big{top:26%;font-size:24px}
.hero .meta{position:absolute;left:16px;bottom:14px;right:14px}
.hero h3{font:900 18px var(--fd);color:#fff;text-shadow:0 3px 8px #000}
.hero p{font:500 12.5px 'Outfit';color:#cfe0f5;margin-top:2px}

/* Player */
.pwrap{display:none;margin:16px 14px 0}
.pwrap.show{display:block;animation:drop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotateX(18deg)}}
.pbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:20px;overflow:hidden;border:1px solid var(--sky);box-shadow:0 0 26px rgba(0,210,255,.35),var(--shadow)}
.pbox video,.pbox canvas{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.pbox video{display:none}
.ptop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
.livefhd{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:800 10.5px 'Plus Jakarta Sans';color:#04140b;background:var(--grn);box-shadow:0 0 16px rgba(0,230,118,.7)}
.livefhd i{width:7px;height:7px;border-radius:50%;background:#04140b;animation:pulse 1.1s infinite}
.sname{font:700 11px 'Plus Jakarta Sans';color:#fff;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:22px 10px 9px;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:3}
.ctl .cb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);color:#fff}
.ctl .cb.main{background:linear-gradient(180deg,var(--org2),var(--org));border:0;box-shadow:0 0 14px rgba(255,107,0,.6)}
.ctl svg{width:16px;height:16px;fill:#fff;stroke:#fff}
.ctl .sp{flex:1}
.qbtn{padding:0 11px;height:34px;border-radius:999px;font:800 11px 'Plus Jakarta Sans';color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--sky)}
.qmenu{position:absolute;right:10px;bottom:52px;z-index:5;display:none;flex-direction:column;border-radius:14px;overflow:hidden;background:rgba(10,14,22,.92);border:1px solid var(--line);backdrop-filter:blur(10px)}
.qmenu.open{display:flex}
.qmenu button{padding:9px 18px;font:700 12px 'Plus Jakarta Sans';color:#dbe8fa;text-align:left}
.qmenu button.on{color:var(--org2);background:rgba(255,107,0,.12)}
.buf{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(0,0,0,.65);font:600 12px 'Outfit';color:#cfe0f5}
.buf.show{display:flex}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--sky);border-right-color:var(--org);animation:spin360 .8s linear infinite}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:0 0 auto;min-width:46px;padding:9px 14px;border-radius:999px;font:800 12px 'Plus Jakarta Sans';background:var(--card);border:1px solid var(--line);color:var(--muted);box-shadow:0 4px 0 -1px rgba(0,0,0,.35)}
.pills button.on{color:#fff;background:linear-gradient(180deg,var(--org2),var(--org));border-color:transparent;box-shadow:0 0 14px rgba(255,107,0,.5)}

/* Servers */
.shead{padding:20px 18px 4px;font:800 13px 'Plus Jakarta Sans';color:var(--muted)}
.servers{display:flex;flex-direction:column;gap:16px;padding:12px 14px}
.srv{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--rad,22px);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;position:relative}
.srv.on{border-color:var(--org);box-shadow:var(--shadow),0 0 22px rgba(255,107,0,.35)}
.srv .no{width:50px;text-align:center}
.srv .no b{display:block;font:900 27px var(--fd);background:linear-gradient(180deg,var(--org2),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));line-height:1}
.srv .no em{display:inline-block;margin-top:6px;font:800 9px 'Plus Jakarta Sans';font-style:normal;padding:2px 7px;border-radius:6px;color:var(--org2);border:1px solid var(--org);box-shadow:0 0 8px rgba(255,107,0,.5)}
.srv .tx{flex:1;min-width:0}
.srv .tx h4{font:800 15.5px 'Plus Jakarta Sans';line-height:1.25}
.srv .tx p{display:flex;align-items:center;gap:7px;margin-top:5px;font:500 12.5px 'Outfit';color:var(--muted)}
.srv .tx .dot{width:7px;height:7px}
.play{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:radial-gradient(circle at 30% 25%,var(--org2),var(--org));box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sky),0 8px 14px rgba(0,0,0,.5),0 0 18px rgba(0,210,255,.45);transition:transform .15s}
.srv:active .play{transform:scale(.92)}
.play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.skel{height:84px;border-radius:22px;background:linear-gradient(100deg,var(--card) 30%,color-mix(in srgb,var(--card) 70%,var(--sky) 30%) 50%,var(--card) 70%);background-size:300% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-300% 0}}

.art.img{background-size:cover;background-position:center}
.pbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#000}
.pbox.embed .ctl{background:none;padding:0 6px 6px;pointer-events:none;justify-content:flex-end}
.pbox.embed .ctl .cb{pointer-events:auto}
.pbox.embed #cPlay,.pbox.embed #cMute,.pbox.embed #cQ,.pbox.embed .sp{display:none}
.sheet input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:700 18px 'Outfit';text-align:center;letter-spacing:6px;margin-bottom:14px;outline:none}

/* Admin */
#admin{transform:translateY(105%);opacity:0;pointer-events:none;z-index:60;background:var(--bg);background-image:va
